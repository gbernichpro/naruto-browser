# =============================================================================
#  Apache - Naruto MMORPG
# =============================================================================

ServerTokens Prod
ServerSignature Off

# O jogo vive atras do proxy do Coolify (Traefik/Caddy). Sem isso, todo
# jogador chega com o IP do proxy, e o jogo usa IP para ban, antifraude e
# controle de multiconta.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16
RemoteIPTrustedProxy 127.0.0.1

# Evita o aviso "Could not reliably determine the server's fully qualified
# domain name" em cada start.
ServerName naruto.local

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# --- Arquivos que nunca podem ser servidos ---------------------------------
# .env carrega a senha do banco e as chaves de SMTP.
<FilesMatch "^\.env">
    Require all denied
</FilesMatch>

# O dump tem o schema inteiro e os dados iniciais do jogo.
<FilesMatch "\.(sql|lock|log|md|dist|bak|sample)$">
    Require all denied
</FilesMatch>

<FilesMatch "^(composer\.(json|lock)|composer\.phar|Dockerfile|docker-compose\.ya?ml)$">
    Require all denied
</FilesMatch>

# --- Diretorios internos ---------------------------------------------------
# _inc/ so existe para ser incluido pelo index.php. Acessar direto expoe
# paginas de debug e trechos que rodam fora do fluxo de autenticacao.
<Directory /var/www/html/_inc>
    Require all denied
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /var/www/html/_cache>
    Require all denied
</Directory>

# reports/ guarda os .txt de relatorio de batalha, lidos pelo PHP e nunca
# servidos direto.
<Directory /var/www/html/reports>
    Require all denied
</Directory>

# uploads/ recebe arquivo enviado por jogador: nada ali pode ser executado.
<Directory /var/www/html/uploads>
    php_flag engine off
    <FilesMatch "\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# O instalador precisa servir apenas index.php; lib.php e schema.sql sao
# includes internos.
<Directory /var/www/html/install>
    <FilesMatch "^(lib\.php|schema\.sql)$">
        Require all denied
    </FilesMatch>
</Directory>

# --- Cabecalhos ------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# --- Cache de assets -------------------------------------------------------
# 76 MB de imagem em _img/: sem isso o navegador rebaixa tudo a cada partida.
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/png  "access plus 30 days"
    ExpiresByType image/gif  "access plus 30 days"
    ExpiresByType text/css   "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
</IfModule>
