; ============================================================================
;  Configuracao PHP do Naruto MMORPG (container)
; ============================================================================

; --- O ajuste mais importante deste arquivo --------------------------------
;  Sem EGPCS o PHP nao copia as variaveis reais do processo para $_ENV, e o
;  php.ini-production das imagens oficiais usa "GPCS". O codigo tambem le por
;  getenv() (_inc/env.php), mas manter EGPCS faz o phpdotenv enxergar a
;  configuracao vinda do painel e nao sobrescrever com valores do .env.
variables_order = "EGPCS"

; --- Erros -----------------------------------------------------------------
;  Producao nao mostra erro na tela. Para depurar, use APP_DEBUG=true, que o
;  index.php respeita, em vez de mexer aqui.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Limites ---------------------------------------------------------------
;  max_execution_time cobre o import das 76 tabelas pelo instalador web.
memory_limit = 256M
max_execution_time = 300
max_input_time = 120
upload_max_filesize = 4M
post_max_size = 8M

; --- Sessao ----------------------------------------------------------------
;  O jogo inteiro depende de sessao; estes flags cortam roubo de cookie e
;  fixacao de sessao sem exigir mudanca no codigo.
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200

; --- Fuso ------------------------------------------------------------------
;  Espelha o padrao de APP_TIMEZONE. Afeta timers de missao, treino e VIP.
date.timezone = "America/Sao_Paulo"

; --- Seguranca ------------------------------------------------------------
expose_php = Off

; --- Opcache ---------------------------------------------------------------
;  Centenas de require_once por request: sem opcache o jogo fica lento.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
