---
# =============================================================================
#  Deploy do Naruto MMORPG via cPanel Git Version Control (HostGator)
# =============================================================================
#  Sem este arquivo o cPanel mostra "The system cannot deploy" e o botao
#  "Deploy HEAD Commit" fica inativo: ele e o roteiro que diz ao cPanel o que
#  fazer depois do pull.
#
#  ---------------------------------------------------------------------------
#  DEPLOYPATH: a pasta que o Apache serve
#  ---------------------------------------------------------------------------
#  Neste servidor o site roda a partir de /home2/geova330/naruto, que e o
#  MESMO diretorio do clone do repositorio (confirmado pelos caminhos no
#  error_log: /home2/geova330/naruto/chat.php).
#
#  Quando clone e pasta publica sao o mesmo lugar, o proprio "git pull" do
#  cPanel ja atualiza o site, e copiar arquivos seria copiar em cima de si
#  mesmo. Por isso a copia abaixo so roda se os dois caminhos forem
#  diferentes.
#
#  Se um dia voce mover o site (dominio principal, subdominio, dominio
#  adicional), basta trocar esta linha pela "Raiz do documento" que o cPanel
#  mostra em Dominios -- a copia passa a acontecer sozinha.
# =============================================================================

deployment:
  tasks:
    - export DEPLOYPATH=/home2/geova330/naruto

    # -----------------------------------------------------------------------
    #  Copia para a pasta publica, quando ela for diferente do clone.
    # -----------------------------------------------------------------------
    #  Por que rsync e nao "cp -R * $DEPLOYPATH":
    #
    #  1. O glob * NAO pega arquivos que comecam com ponto. Com cp, o
    #     .htaccess (que bloqueia _inc/, vendor/, .env e os .sql) ficaria de
    #     fora e o site subiria sem nenhuma dessas protecoes.
    #
    #  2. Precisamos preservar arquivos que existem so no servidor: o .env com
    #     a senha do banco, e as pastas com dados de jogador.
    #
    #  Nao ha --delete de proposito: apagar no destino o que nao existe no
    #  repositorio e arriscado demais em cima de um jogo com dados reais.
    # -----------------------------------------------------------------------
    - if [ "$(readlink -f .)" != "$(readlink -f $DEPLOYPATH)" ]; then /usr/bin/rsync -a --exclude '.git/' --exclude '.gitignore' --exclude '.env' --exclude '_cache/' --exclude 'uploads/' --exclude 'reports/' --exclude 'Dockerfile' --exclude 'docker/' --exclude 'docker-compose.yml' --exclude '.dockerignore' --exclude '.cpanel.yml' --exclude 'composer.phar' ./ $DEPLOYPATH/; else echo "[naruto] clone e pasta publica sao o mesmo diretorio - o git pull ja publicou, nada a copiar."; fi

    # -----------------------------------------------------------------------
    #  Diretorios que o jogo grava em runtime.
    # -----------------------------------------------------------------------
    #  Guardam dado de jogador: avatar enviado, relatorio de batalha e a trava
    #  do instalador. Sao criados se faltarem; o conteudo nunca e tocado.
    - /bin/mkdir -p $DEPLOYPATH/_cache $DEPLOYPATH/uploads $DEPLOYPATH/reports
    - /bin/chmod 755 $DEPLOYPATH/_cache $DEPLOYPATH/uploads $DEPLOYPATH/reports

# =============================================================================
#  O .env NAO e copiado, de proposito
# =============================================================================
#  Ele carrega a senha do banco de producao e vive so no servidor. Se o deploy
#  o sobrescrevesse, o jogo sairia do ar a cada publicacao.
#
#  Isso significa que chaves novas precisam ser adicionadas a mao no .env do
#  servidor. Nesta versao, confira se estas existem (veja .env.example):
#
#     INSTALLER_ENABLED=false     fecha /install/ no site publico
#     APP_DEBUG=false             nao vaza caminho do servidor em erro
#     APP_TIMEZONE=America/Fortaleza
#     DB_PORT=3306
#
#  Se INSTALLER_ENABLED faltar, o instalador ainda assim se fecha sozinho ao
#  detectar que o banco ja tem as tabelas do jogo -- mas deixar explicito e
#  mais seguro.
# =============================================================================
